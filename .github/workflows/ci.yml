name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub release with this tag (e.g. v0.1.0); leave empty to just build"
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libwayland-dev libgtk-3-dev
      - name: Engine tests
        run: cargo test -p engine --all-targets
      - name: Build app
        run: cargo build -p app

  build:
    name: Build ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: rexcel-windows-x64
            exe: rexcel.exe
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: rexcel-macos-arm64
            exe: rexcel
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            artifact: rexcel-macos-x64
            exe: rexcel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Test engine
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test -p engine --target ${{ matrix.target }}
      - name: Build release
        run: cargo build -p app --release --target ${{ matrix.target }}
      - name: Package (macOS app bundle)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP=dist/RExcel.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/${{ matrix.target }}/release/rexcel "$APP/Contents/MacOS/rexcel"
          cp packaging/macos/Info.plist "$APP/Contents/Info.plist"
          cd dist && zip -r ../${{ matrix.artifact }}.zip RExcel.app
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/rexcel.exe dist/
          cd dist && 7z a ../${{ matrix.artifact }}.zip rexcel.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*.zip
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: RExcel ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
