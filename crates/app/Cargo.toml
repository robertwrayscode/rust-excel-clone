[package]
name = "app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RExcel desktop spreadsheet application"
build = "build.rs"

[[bin]]
name = "rexcel"
path = "src/main.rs"

[dependencies]
engine = { path = "../engine" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "clipboard", "links"] }
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
rfd = "0.17"
arboard = { version = "3", default-features = false }
dirs = "6"
spellbook = "0.4"

[build-dependencies]
winresource = "0.1"
